# Generated by the private monorepo export; see PROVENANCE.json.
packages:
  - 'packages/*'

verifyDepsBeforeRun: false

# Releases install with --ignore-scripts. No dependency needs a build step:
# esbuild and Vite+ load their platform binaries from optional packages.
allowBuilds:
  esbuild: false

# Three days: a newly published dependency version waits before it can
# enter this lockfile (the monorepo uses one day).
minimumReleaseAge: 4320

overrides:
  undici@^7: 7.30.1
  source-map-js@1.2.1: 1.2.2
  picomatch: 4.0.7
  postcss: 8.5.32
  zod: 4.6.7
  '@types/node@': 26.6.4
  '@volar/typescript>typescript': 6.0.3
  '@napi-rs/wasm-runtime@1.2.4>@emnapi/runtime': 1.11.3
  'vite@*': 'catalog:'
  'vitest@*': 'catalog:'

patchedDependencies:
  vitest@5.1.0: patches/vitest@5.1.0.patch

catalog:
  vite: 'npm:@voidzero-dev/vite-plus-core@8.3.8000'
  vitest: 5.1.0
  vite-plus: 1.7.0
  '@vitest/coverage-v8': 5.1.0
  '@vitest/ui': 5.1.0

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
