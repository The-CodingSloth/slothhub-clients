name: CI

# Install, build, test and the packed-client readiness check on every push to
# main and every pull request. No job uses secrets or write permissions, and
# nothing uses pull_request_target, so a fork's code never runs with
# credentials. Workflows from first-time contributors wait for maintainer
# approval (repository setting, see RELEASING.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build, test and check the packed clients
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install locked dependencies without install scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check the tree for forbidden content
        run: pnpm check:public-tree

      - name: Type-check
        run: pnpm type-check

      - name: Build and test
        run: pnpm test

      - name: Release contracts
        run: pnpm release:test

      - name: Installed CLI and MCP workflows
        run: pnpm test:agent-clients "${{ runner.temp }}/client-readiness.json"

      - name: Upload readiness receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-readiness-ubuntu
          path: ${{ runner.temp }}/client-readiness.json
          if-no-files-found: error
          retention-days: 7

  platforms:
    name: Installed clients on ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: '22.22.0'}
          - {os: windows-latest, node: '22.22.0'}
          - {os: macos-latest, node: '22.22.0'}
          - {os: ubuntu-latest, node: '26.13.0'}
          - {os: windows-latest, node: '26.13.0'}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install locked dependencies without install scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and verify installed CLI and MCP workflows
        run: pnpm build && pnpm test:agent-clients "${{ runner.temp }}/client-readiness.json"
